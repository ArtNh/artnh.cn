<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 迷航与邂逅</title>
    <meta name="description" content="迷航与邂逅 - 404 错误页面" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ── 重置与变量定义 ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 完美继承自 index.html 的全局变量系统 */
            --bg:     #060606;
            --fg:     #f0ede8;
            --muted:  #666;
            --accent: #c8b89a; /* 极具质感的暖沙金 */
            --line:   #1c1c1c;
            --glow:   rgba(200, 184, 154, 0.04);
            
            --card-w: 380px;
            --card-h: 540px;
        }

        html, body {
            height: 100%;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* ── Canvas 背景 ── */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ── 容器布局 ── */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* ── 3D 卡片容器 ── */
        .card-container {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            perspective: 1500px; /* 3D 深度感 */
            max-width: 100%;
            /* 引入 index.html 同步的加载动画 */
            animation: fadeUp 1.2s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        /* ── 旋转主体 ── */
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* 翻转过渡，JS 在 hover 时会动态将其调小以提供更跟手的 3D 阻尼感 */
            transition: transform 0.8s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        /* ── 卡片面共用样式 ── */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            border: 1px solid var(--line);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        0 0 40px rgba(0, 0, 0, 0.6);
            transition: border-color 0.8s, box-shadow 0.8s;
        }

        /* ── 正面：第一幕 · 迷航 ── */
        .card-front {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transform: rotateY(0deg);
        }

        .card-container:hover .card-face {
            border-color: rgba(200, 184, 154, 0.2); /* 暖沙金发光，非常克制 */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        0 0 50px var(--glow);
        }

        /* ── 背面：第二幕 · 邂逅 ── */
        .card-back {
            /* 渐变遮罩确保文字识别度，背景图自适应覆盖 */
            background-image: 
                linear-gradient(to bottom, rgba(6, 6, 6, 0.3) 0%, rgba(6, 6, 6, 0.9) 100%), 
                url('1000104636.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: rotateY(180deg); /* 初始旋转180度隐藏 */
        }

        /* ── 卡片头部 ── */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .system-time {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ── 卡片主体 ── */
        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: -20px;
        }

        /* 404 科技感大标题 */
        .glitch-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 5.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--fg) 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .scene-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--fg);
            margin-bottom: 16px;
        }

        .scene-desc {
            font-size: 0.82rem;
            line-height: 1.8;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .card-back .scene-desc {
            color: #b0b5c0; /* 加深一点对比度，配合背景图 */
        }

        /* ── 卡片底部 ── */
        .card-footer {
            display: flex;
            justify-content: center;
        }

        /* 提示词 */
        .hover-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: var(--muted);
            opacity: 0.7;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .hint-icon {
            color: var(--accent);
        }

        /* ── 按钮组 ── */
        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 13px 18px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 400;
            text-align: center;
            text-decoration: none;
            letter-spacing: 0.12em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        /* 捕获星空（下载高清原图） */
        .btn-capture {
            background-color: var(--accent);
            color: #060606;
            box-shadow: 0 4px 15px rgba(200, 184, 154, 0.15);
        }

        .btn-capture::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: 1;
        }

        .btn-capture:hover::before {
            transform: translateX(100%);
        }

        .btn-capture:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(200, 184, 154, 0.3);
            background-color: #d8c8aa;
        }

        /* 返回地球（跳转回主页） */
        .btn-home {
            background-color: transparent;
            color: var(--fg);
            border: 1px solid rgba(240, 237, 238, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-home:hover {
            background-color: rgba(240, 237, 238, 0.06);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* ── 移动端适配 ── */
        @media (max-width: 480px) {
            :root {
                --card-w: 310px;
                --card-h: 470px;
            }
            .card-face {
                padding: 30px 24px;
            }
            .glitch-title {
                font-size: 4.2rem;
                margin-bottom: 15px;
            }
            .scene-title {
                font-size: 0.95rem;
                margin-bottom: 10px;
            }
            .scene-desc {
                font-size: 0.75rem;
                line-height: 1.6;
            }
            .btn {
                padding: 11px 12px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas 动态粒子背景 -->
    <canvas id="space-canvas"></canvas>

    <div class="container">
        <!-- 3D 翻转卡片 -->
        <div class="card-container" id="404-card" role="button" aria-label="交互卡片，请点击或悬停翻转" tabindex="0">
            <div class="card">
                
                <!-- 卡片正面：第一幕 迷航 -->
                <div class="card-face card-front">
                    <div class="card-header">
                        <div class="status-badge">Lost in deep space</div>
                        <div class="system-time">ERR_404</div>
                    </div>
                    <div class="card-body">
                        <div class="glitch-title">404</div>
                        <h2 class="scene-title">【第一幕：迷航】</h2>
                        <p class="scene-desc">我们在群星的脉冲中丢失了彼此的信号。<br>这里是无尽的冷寂，唯有光线在引力下微微偏折。</p>
                    </div>
                    <div class="card-footer">
                        <div class="hover-hint">
                            <span class="hint-icon">✧</span>
                            <span class="hint-text">将视线停留，偏折光线</span>
                        </div>
                    </div>
                </div>

                <!-- 卡片背面：第二幕 邂逅 -->
                <div class="card-face card-back">
                    <div class="card-header">
                        <div class="status-badge">Signal established</div>
                        <div class="system-time">COOR_FOUND</div>
                    </div>
                    <div class="card-body">
                        <h2 class="scene-title">【第二幕：邂逅】</h2>
                        <p class="scene-desc">光年之外，星河横流。<br>终在此处与你重逢，这是一颗属于我们的星球。</p>
                    </div>
                    <div class="card-footer">
                        <div class="btn-group">
                            <a href="1000104636.jpg" download="1000104636.jpg" class="btn btn-capture" id="btn-download" title="下载高清原图">
                                <span>捕获星空</span>
                            </a>
                            <a href="/" class="btn btn-home" title="返回主页">
                                <span>返回地球</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript：粒子背景与 3D 视差倾斜效果 -->
    <script>
        // ── Canvas 动态星空粒子（极致克制） ──
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = [];
        // 降低星尘密度，营造高级克制感
        const starCount = Math.min(70, Math.floor((width * height) / 25000)); 

        // 鼠标视差系数
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - width / 2) / (width / 2);
            targetMouseY = (e.clientY - height / 2) / (height / 2);
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 粒子构造函数
        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = 0;
                // 更细微的尺寸 (0.2px 到 1.0px)
                this.size = Math.random() * 0.8 + 0.2; 
                this.speedY = Math.random() * 0.04 + 0.01; 
                this.speedX = (Math.random() - 0.5) * 0.015;
                // 更暗淡的透明度 (0.15 到 0.5)
                this.alpha = Math.random() * 0.35 + 0.15;
                this.flickerSpeed = Math.random() * 0.01 + 0.003;
                this.flickerDir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                this.alpha += this.flickerSpeed * this.flickerDir;
                if (this.alpha >= 0.65) {
                    this.alpha = 0.65;
                    this.flickerDir = -1;
                } else if (this.alpha <= 0.1) {
                    this.alpha = 0.1;
                    this.flickerDir = 1;
                }

                if (this.y > height || this.x < 0 || this.x > width) {
                    this.reset();
                }
            }

            draw() {
                // 降低视差幅度，确保优雅
                const offsetX = mouseX * this.size * 5;
                const offsetY = mouseY * this.size * 5;

                // 配合全局暖沙金色调，粒子渲染微弱暖白光
                ctx.fillStyle = `rgba(240, 237, 232, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x + offsetX, this.y + offsetY, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 初始化粒子
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        // 动画循环
        function animate() {
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;

            ctx.fillStyle = '#060606'; // index.html 主背景色
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();


        // ── 3D 视差倾斜与翻转融合（JS 接管） ──
        const cardContainer = document.getElementById('404-card');
        const card = cardContainer.querySelector('.card');
        
        let isFlipped = false;
        let isHovered = false;

        // 阻止按钮点击穿透
        const downloadBtn = document.getElementById('btn-download');
        const homeBtn = document.querySelector('.btn-home');

        [downloadBtn, homeBtn].forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); 
            });
        });

        // 切换翻转锁定
        cardContainer.addEventListener('click', (e) => {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardContainer.classList.add('is-flipped');
            } else {
                cardContainer.classList.remove('is-flipped');
            }
            updateCardTransform(e);
        });

        // 键盘无障碍支持
        cardContainer.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                isFlipped = !isFlipped;
                if (isFlipped) {
                    cardContainer.classList.add('is-flipped');
                } else {
                    cardContainer.classList.remove('is-flipped');
                }
                card.style.transition = 'transform 0.8s cubic-bezier(0.15, 0.85, 0.35, 1)';
                card.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
            }
        });

        // 鼠标移入：为了让 3D 偏转更跟手但保留丝滑感，这里设定 0.15s 过渡阻尼
        cardContainer.addEventListener('mouseenter', () => {
            isHovered = true;
            card.style.transition = 'transform 0.15s cubic-bezier(0.25, 1, 0.5, 1)';
        });

        // 鼠标移出：恢复平滑的 0.8s 过渡动画，优雅归位
        cardContainer.addEventListener('mouseleave', () => {
            isHovered = false;
            card.style.transition = 'transform 0.8s cubic-bezier(0.15, 0.85, 0.35, 1)';
            if (isFlipped) {
                card.style.transform = 'rotateY(180deg)';
            } else {
                card.style.transform = 'rotateY(0deg)';
            }
        });

        // 鼠标在卡片内移动，触发 3D 偏转
        cardContainer.addEventListener('mousemove', (e) => {
            if (!isHovered) return;
            updateCardTransform(e);
        });

        // 计算 3D 倾斜和旋转角度
        function updateCardTransform(e) {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const w = rect.width;
            const h = rect.height;
            
            // 相对中心的位移比例 (-0.5 到 0.5)
            const px = (x / w) - 0.5;
            const py = (y / h) - 0.5;
            
            // 极其克制的 6 度最大倾斜角，保持高级与质感
            const maxTilt = 6;
            const tiltX = px * maxTilt;  // 绕 Y 轴的微调
            const tiltY = -py * maxTilt; // 绕 X 轴的微调
            
            // 判断是否显示背面
            const showBack = isHovered || isFlipped;
            
            if (showBack) {
                // 背面：基准旋转 180 度，叠加视差微调
                card.style.transform = `rotateY(${180 + tiltX}deg) rotateX(${-tiltY}deg)`;
            } else {
                // 正面：基准旋转 0 度，叠加视差微调
                card.style.transform = `rotateY(${tiltX}deg) rotateX(${tiltY}deg)`;
            }
        }
    </script>
</body>
</html>

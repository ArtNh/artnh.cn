<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 迷航与邂逅</title>
    <meta name="description" content="迷航与邂逅 - 404 错误页面" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ── 重置与变量定义 ── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #030508;
            --fg: #f0ede8;
            --muted: #8892b0;
            --accent-blue: #00f2fe;
            --accent-cyan: #4facfe;
            --glow: rgba(0, 242, 254, 0.15);
            --card-w: 380px;
            --card-h: 540px;
        }

        html, body {
            height: 100%;
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* ── Canvas 背景 ── */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ── 容器布局 ── */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* ── 3D 卡片容器 ── */
        .card-container {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            perspective: 1500px; /* 3D 深度感 */
            max-width: 100%;
        }

        /* ── 旋转主体 ── */
        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        /* Hover 和 Active (通过 JS/点击) 时翻转 */
        .card-container:hover .card,
        .card-container.is-flipped .card {
            transform: rotateY(180deg);
        }

        /* ── 卡片面共用样式 ── */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        0 0 50px rgba(0, 242, 254, 0.03);
            transition: border-color 0.5s, box-shadow 0.5s;
        }

        /* ── 正面：第一幕 · 迷航 ── */
        .card-front {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transform: rotateY(0deg);
        }

        .card-container:hover .card-front {
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        0 0 50px rgba(0, 242, 254, 0.12);
        }

        /* ── 背面：第二幕 · 邂逅 ── */
        .card-back {
            /* 渐变遮罩确保文字识别度，背景图自适应覆盖 */
            background-image: 
                linear-gradient(to bottom, rgba(3, 5, 8, 0.3) 0%, rgba(3, 5, 8, 0.85) 100%), 
                url('1000104636.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: rotateY(180deg); /* 初始旋转180度隐藏 */
        }

        .card-container:hover .card-back {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        0 0 50px rgba(255, 255, 255, 0.08);
        }

        /* ── 卡片头部 ── */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .card-back .status-badge::before {
            background-color: #5af;
            box-shadow: 0 0 8px #5af;
        }

        .system-time {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ── 卡片主体 ── */
        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: -20px;
        }

        /* 404 科技感大标题 */
        .glitch-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 5.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff 30%, var(--muted) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .scene-title {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--fg);
            margin-bottom: 16px;
        }

        .scene-desc {
            font-size: 0.82rem;
            line-height: 1.8;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .card-back .scene-desc {
            color: #d1d5db; /* 加深一点对比度，适合背景图 */
        }

        /* ── 卡片底部 ── */
        .card-footer {
            display: flex;
            justify-content: center;
        }

        /* 提示词 */
        .hover-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: var(--muted);
            opacity: 0.7;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .hint-icon {
            color: var(--accent-blue);
        }

        /* ── 按钮组 ── */
        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 13px 18px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 400;
            text-align: center;
            text-decoration: none;
            letter-spacing: 0.12em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        /* 捕获星空（下载高清原图） */
        .btn-capture {
            background-color: #ffffff;
            color: #030508;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.12);
        }

        .btn-capture::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
            z-index: 1;
        }

        .btn-capture:hover::before {
            transform: translateX(100%);
        }

        .btn-capture:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
            background-color: #f7f9fc;
        }

        /* 返回地球（跳转回主页） */
        .btn-home {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-home:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* ── 移动端适配 ── */
        @media (max-width: 480px) {
            :root {
                --card-w: 310px;
                --card-h: 470px;
            }
            .card-face {
                padding: 30px 24px;
            }
            .glitch-title {
                font-size: 4.2rem;
                margin-bottom: 15px;
            }
            .scene-title {
                font-size: 0.95rem;
                margin-bottom: 10px;
            }
            .scene-desc {
                font-size: 0.75rem;
                line-height: 1.6;
            }
            .btn {
                padding: 11px 12px;
                font-size: 0.72rem;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas 动态粒子背景 -->
    <canvas id="space-canvas"></canvas>

    <div class="container">
        <!-- 3D 翻转卡片 -->
        <div class="card-container" id="404-card" role="button" aria-label="交互卡片，请点击或悬停翻转" tabindex="0">
            <div class="card">
                
                <!-- 卡片正面：第一幕 迷航 -->
                <div class="card-face card-front">
                    <div class="card-header">
                        <div class="status-badge">Lost in deep space</div>
                        <div class="system-time">ERR_404</div>
                    </div>
                    <div class="card-body">
                        <div class="glitch-title">404</div>
                        <h2 class="scene-title">【第一幕：迷航】</h2>
                        <p class="scene-desc">我们在群星的脉冲中丢失了彼此的信号。<br>这里是无尽的冷寂，唯有光线在引力下微微偏折。</p>
                    </div>
                    <div class="card-footer">
                        <div class="hover-hint">
                            <span class="hint-icon">✧</span>
                            <span class="hint-text">将视线停留，偏折光线</span>
                        </div>
                    </div>
                </div>

                <!-- 卡片背面：第二幕 邂逅 -->
                <div class="card-face card-back">
                    <div class="card-header">
                        <div class="status-badge">Signal established</div>
                        <div class="system-time">COOR_FOUND</div>
                    </div>
                    <div class="card-body">
                        <h2 class="scene-title">【第二幕：邂逅】</h2>
                        <p class="scene-desc">光年之外，星河横流。<br>终在此处与你重逢，这是一颗属于我们的星球。</p>
                    </div>
                    <div class="card-footer">
                        <div class="btn-group">
                            <a href="1000104636.jpg" download="1000104636.jpg" class="btn btn-capture" id="btn-download" title="下载高清原图">
                                <span>捕获星空</span>
                            </a>
                            <a href="/" class="btn btn-home" title="返回主页">
                                <span>返回地球</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript：粒子背景与翻转增强 -->
    <script>
        // ── Canvas 动态星空粒子 ──
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = [];
        const starCount = Math.min(120, Math.floor((width * height) / 10000)); // 根据屏幕大小调节粒子数量
        const shootingStars = [];

        // 鼠标影响视差
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            // 将鼠标坐标标准化到 -1 到 1 之间
            targetMouseX = (e.clientX - width / 2) / (width / 2);
            targetMouseY = (e.clientY - height / 2) / (height / 2);
        });

        // 窗口尺寸自适应
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 粒子构造函数
        class Star {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // 初始分布全屏
            }

            reset() {
                this.x = Math.random() * width;
                this.y = 0;
                this.size = Math.random() * 1.5 + 0.3; // 随机大小
                this.speedY = Math.random() * 0.05 + 0.02; // 缓慢下落
                this.speedX = (Math.random() - 0.5) * 0.02;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.flickerSpeed = Math.random() * 0.015 + 0.005;
                this.flickerDir = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                // 缓慢移动
                this.y += this.speedY;
                this.x += this.speedX;

                // 闪烁
                this.alpha += this.flickerSpeed * this.flickerDir;
                if (this.alpha >= 0.8) {
                    this.alpha = 0.8;
                    this.flickerDir = -1;
                } else if (this.alpha <= 0.1) {
                    this.alpha = 0.1;
                    this.flickerDir = 1;
                }

                // 越界重置
                if (this.y > height || this.x < 0 || this.x > width) {
                    this.reset();
                }
            }

            draw() {
                // 加上视差偏移
                const offsetX = mouseX * this.size * 12;
                const offsetY = mouseY * this.size * 12;

                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x + offsetX, this.y + offsetY, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 流星类
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.4);
                this.len = Math.random() * 80 + 40;
                this.speed = Math.random() * 8 + 4;
                this.angle = Math.PI / 6; // 30度角滑落
                this.alpha = 1;
                this.width = Math.random() * 1.2 + 0.5;
            }

            update() {
                this.x -= this.speed * Math.cos(this.angle);
                this.y += this.speed * Math.sin(this.angle);
                this.alpha -= 0.015;

                if (this.alpha <= 0 || this.x < 0 || this.y > height) {
                    this.reset();
                    return false; // 需要移出数组
                }
                return true;
            }

            draw() {
                ctx.strokeStyle = `rgba(135, 206, 250, ${this.alpha})`;
                ctx.lineWidth = this.width;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x + this.len * Math.cos(this.angle), 
                    this.y - this.len * Math.sin(this.angle)
                );
                ctx.stroke();
            }
        }

        // 初始化粒子
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        // 动画主循环
        function animate() {
            // 平滑视差过渡
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;

            // 清屏，带有一点余辉效果以实现流星拖尾，不过主要用渐变色清屏
            ctx.fillStyle = '#030508';
            ctx.fillRect(0, 0, width, height);

            // 绘制粒子
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 随机触发流星
            if (Math.random() < 0.002 && shootingStars.length < 2) {
                shootingStars.push(new ShootingStar());
            }

            // 更新绘制流星
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const active = shootingStars[i].update();
                if (active) {
                    shootingStars[i].draw();
                } else {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // ── 移动端 / 点击翻转支持 ──
        const cardContainer = document.getElementById('404-card');
        
        // 阻止按钮的点击穿透到卡片容器上
        const downloadBtn = document.getElementById('btn-download');
        const homeBtn = document.querySelector('.btn-home');

        [downloadBtn, homeBtn].forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止事件冒泡，防止点击按钮时卡片翻转回去
            });
        });

        // 切换翻转类名
        cardContainer.addEventListener('click', () => {
            cardContainer.classList.toggle('is-flipped');
        });

        // 键盘无障碍支持 (回车键翻转)
        cardContainer.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                cardContainer.classList.toggle('is-flipped');
            }
        });
    </script>
</body>
</html>

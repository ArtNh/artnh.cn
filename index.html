<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTNH · CUI JIN-LIN</title>
    <meta name="description" content="崔金林 · 空间设计师 · 个人主页" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:     #060606;
            --fg:     #f0ede8;
            --muted:  #666;
            --accent: #c8b89a;
            --line:   #1c1c1c;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: clamp(2.5rem, 10vw, 7rem);
        }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .a1 { animation: fadeUp 0.9s 0.00s ease both; }
        .a2 { animation: fadeUp 0.9s 0.15s ease both; }
        .a3 { animation: fadeUp 0.9s 0.28s ease both; }
        .a4 { animation: fadeUp 0.9s 0.42s ease both; }

        /* ── Name ── */
        .name {
            font-size: clamp(2.4rem, 7vw, 4rem);
            font-weight: 300;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--fg);
        }

        .name-sub {
            display: block;
            font-size: 0.38em;
            letter-spacing: 0.55em;
            color: var(--muted);
            margin-top: 1em;
            font-weight: 400;
        }

        /* ── Divider ── */
        .divider {
            width: 2.2rem;
            height: 1px;
            background: var(--accent);
            margin: 2.8rem 0;
        }

        /* ── Bio ── */
        .bio {
            font-size: 0.82rem;
            line-height: 2;
            color: var(--muted);
            letter-spacing: 0.03em;
            margin-bottom: 3.2rem;
        }

        /* ── Links ── */
        .links {
            display: flex;
            flex-direction: column;
            max-width: 480px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.3rem 0;
            border-top: 1px solid var(--line);
            text-decoration: none;
            color: var(--fg);
            transition: color 0.25s;
        }

        .link-item:last-child {
            border-bottom: 1px solid var(--line);
        }

        .link-item:hover {
            color: var(--accent);
        }

        .link-item:hover .arrow {
            transform: translate(5px, -5px);
            color: var(--accent);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .link-title {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .link-hint {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .arrow {
            font-size: 1rem;
            color: #333;
            transition: transform 0.25s, color 0.25s;
            flex-shrink: 0;
            margin-left: 1rem;
        }

        /* ── Footer ── */
        footer {
            position: fixed;
            bottom: 2rem;
            left: clamp(2.5rem, 10vw, 7rem);
            font-size: 0.6rem;
            letter-spacing: 0.22em;
            color: #252525;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1 class="name a1">
        ARTNH
        <span class="name-sub">CUI &nbsp;JIN-LIN</span>
    </h1>

    <div class="divider a2"></div>

    <p class="bio a3">
        空间设计师 &nbsp;·&nbsp; 环境设计探索<br>
        陕西理工大学艺术学院 &nbsp;·&nbsp; 环境设计专业
    </p>

    <nav class="links a4">
        <a class="link-item" href="https://www.artnh.cn" rel="noopener">
            <div class="link-info">
                <span class="link-title">Portfolio</span>
                <span class="link-hint">www.artnh.cn &nbsp;·&nbsp; 作品集</span>
            </div>
            <span class="arrow">↗</span>
        </a>

        <a class="link-item" href="https://github.com/ArtNh" target="_blank" rel="noopener">
            <div class="link-info">
                <span class="link-title">GitHub</span>
                <span class="link-hint">github.com/ArtNh &nbsp;·&nbsp; 代码仓库</span>
            </div>
            <span class="arrow">↗</span>
        </a>
    </nav>

    <footer>© 2025 &nbsp;CUI JIN-LIN &nbsp;·&nbsp; ARTNH.CN</footer>

</body>
</html>

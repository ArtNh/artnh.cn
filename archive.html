<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部档案 · ARTNH</title>
<link rel="icon" href="favicon.svg?v=20261116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261116c">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--body); overflow-x: hidden; }

  .arc-header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1rem clamp(1.2rem, 5vw, 4.5rem);
    background: var(--yellow); border-bottom: var(--line);
  }
  .arc-brand {
    font-family: var(--pop); font-weight: 800; font-size: 1.15rem; color: var(--ink);
    text-decoration: none; background: var(--paper-2); border: var(--line);
    border-radius: 999px; padding: .28rem 1.1rem; box-shadow: var(--shadow-sm);
    transform: rotate(-3deg); transition: transform .2s var(--ease-pop);
  }
  .arc-brand:hover { transform: rotate(0) translateY(-2px); }
  .arc-title { font-family: var(--pop); font-weight: 800; font-size: 1rem; letter-spacing: .08em; color: var(--ink); }
  .arc-back {
    font-family: var(--pop); font-weight: 800; font-size: .8rem; color: var(--ink);
    text-decoration: none; background: var(--paper-2); border: 2px solid var(--ink);
    border-radius: 999px; padding: .4rem 1rem; box-shadow: var(--shadow-sm);
    transition: transform .16s var(--ease-pop), box-shadow .16s var(--ease-pop);
  }
  .arc-back:hover { transform: translate(-2px,-2px); box-shadow: 5px 6px 0 var(--ink); }

  .arc-main { padding: clamp(2rem, 5vw, 4rem) clamp(1.2rem, 5vw, 4.5rem) 5rem; }

  .arc-head { text-align: center; margin-bottom: 2.4rem; }
  .arc-kicker {
    display: inline-block; font-family: var(--pop); font-weight: 800; font-size: .68rem;
    letter-spacing: .16em; color: var(--ink); background: var(--mint);
    border: 2px solid var(--ink); border-radius: 999px; padding: .2rem .9rem;
    box-shadow: var(--shadow-sm);
  }
  .arc-head h1 { font-family: var(--pop); font-weight: 800; font-size: clamp(2rem, 6vw, 3.4rem); margin: .9rem 0 .4rem; }
  .arc-head p { color: var(--ink-soft); font-weight: 600; margin: 0; }

  .arc-tools { display: flex; flex-direction: column; gap: 1rem; align-items: center; margin-bottom: 2.6rem; }
  .arc-search {
    display: flex; align-items: center; gap: .6rem; width: min(460px, 100%);
    background: var(--paper-2); border: var(--line); border-radius: 999px;
    padding: .55rem 1.2rem; box-shadow: var(--shadow-sm);
  }
  .arc-search span { font-size: 1.3rem; color: var(--ink-soft); }
  .arc-search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-family: var(--body); font-weight: 700; font-size: .92rem; color: var(--ink);
  }
  .arc-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; }
  .arc-chip {
    font-family: var(--pop); font-weight: 800; font-size: .78rem; color: var(--ink);
    background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px;
    padding: .32rem .95rem; cursor: pointer; box-shadow: var(--shadow-sm);
    transition: transform .16s var(--ease-pop), box-shadow .16s var(--ease-pop);
  }
  .arc-chip:hover { transform: translate(-2px,-2px); box-shadow: 5px 6px 0 var(--ink); }
  .arc-chip.active { background: var(--ink); color: #fff; }
  .arc-chip .n { font-size: .62rem; opacity: .7; margin-left: .3rem; }

  .arc-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2rem 2.4rem;
  }
  .arc-card {
    position: relative; display: block; text-decoration: none; color: inherit;
    background: var(--paper-2); border: var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    transform: rotate(var(--tilt, -1deg));
    transition: transform .28s var(--ease-pop), box-shadow .28s var(--ease-pop);
  }
  .arc-card:hover { transform: rotate(0) translateY(-8px) scale(1.01); box-shadow: 12px 15px 0 var(--ink); }
  .arc-art { position: relative; height: 152px; margin: 14px 14px 0; border: var(--line); border-radius: 18px; background: var(--c); overflow: hidden; }
  .arc-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arc-num { position: absolute; z-index: 2; right: 16px; top: 6px; font-family: var(--pop); font-size: 3.6rem; font-weight: 800; color: var(--paper-2); line-height: 1; text-shadow: 3px 3px 0 var(--ink); }
  .arc-tag { position: absolute; z-index: 3; left: 14px; bottom: 12px; font-family: var(--pop); font-size: .7rem; font-weight: 800; color: var(--ink); background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; padding: .15rem .8rem; }
  .arc-body { padding: 1.2rem 1.4rem 1.35rem; }
  .arc-meta { font-family: var(--pop); font-size: .68rem; font-weight: 800; letter-spacing: .06em; color: var(--ink-soft); margin-bottom: .6rem; }
  .arc-meta .cat { color: var(--c); }
  .arc-body h3 { font-family: var(--pop); font-weight: 800; font-size: 1.24rem; line-height: 1.35; margin: 0 0 .5rem; }
  .arc-body p { font-size: .84rem; line-height: 1.7; font-weight: 600; color: var(--ink-soft); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .arc-empty { text-align: center; padding: 5rem 1rem; font-family: var(--pop); font-weight: 800; color: var(--ink-soft); }

  @media (max-width: 700px) {
    .arc-title { display: none; }
    .arc-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .arc-card, .arc-chip, .arc-back, .arc-brand { transition: none !important; }
  }
</style>
</head>
<body>
  <header class="arc-header">
    <a class="arc-brand" href="index.html">ARTNH</a>
    <span class="arc-title">ALL FRAMES / 全部档案</span>
    <a class="arc-back" href="index.html#feed">← 回首页</a>
  </header>

  <main class="arc-main">
    <div class="arc-head">
      <span class="arc-kicker">ARCHIVE</span>
      <h1>全部档案</h1>
      <p>每一篇都是一段存起来的时间。搜索、筛选，点开任意一篇。</p>
    </div>
    <div class="arc-tools">
      <label class="arc-search">
        <span>⌕</span>
        <input type="search" id="arc-q" placeholder="搜索标题 / 标签 / 摘要" autocomplete="off" />
      </label>
      <div class="arc-filters" id="arc-filters"></div>
    </div>
    <div class="arc-grid" id="arc-grid"></div>
    <div class="arc-empty" id="arc-empty" hidden>这个格子里暂时空空的。</div>
  </main>

  <script src="posts.js?v=20261117a"></script>
  <script>
  (function () {
    const META = window.BLOG_META || { categories: [] };
    const POSTS = window.BLOG_POSTS || [];
    const CATS = META.categories || [];
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    const byId = Object.fromEntries(CATS.map(c => [c.id, c]));
    const catOf = p => byId[p.category] || CATS[0] || { label:'未分类', en:'OTHER', color:'#3B4EFF' };
    const INK = '#1B1830', PAPER = '#FFFDF8', GOLD = '#FFD84D';
    const BLUE = '#3B4EFF', PINK = '#FF5D8F', MINT = '#2FD6A6', VIOLET = '#8B5CF6', ORANGE = '#FF9F1C';
    const COVER_BG = [BLUE, PINK, GOLD, MINT, VIOLET, ORANGE];
    const COVER_BASE = [
      `<circle cx="206" cy="58" r="56" fill="${GOLD}" stroke="${INK}" stroke-width="5"/>
       <path d="M-8 134 L108 26 L174 158 Z" fill="${PINK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <path d="M26 118 h84 M26 134 h52" stroke="${PAPER}" stroke-width="7" stroke-linecap="round"/>
       <circle cx="54" cy="38" r="11" fill="${MINT}" stroke="${INK}" stroke-width="4"/>`,
      `<path d="M-10 96 q40 -34 80 0 t80 0 t80 0 t80 0 v70 h-320 z" fill="${MINT}" stroke="${INK}" stroke-width="5"/>
       <path d="M150 18 l9 22 24 2 -18 16 5 24 -20 -12 -20 12 5 -24 -18 -16 24 -2z" fill="${GOLD}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <g fill="${PAPER}"><circle cx="40" cy="36" r="7"/><circle cx="66" cy="24" r="5"/><circle cx="264" cy="34" r="6"/></g>`,
      `<path d="M40 -10 L150 -10 L110 160 L0 160 Z" fill="${VIOLET}" stroke="${INK}" stroke-width="5"/>
       <circle cx="214" cy="74" r="45" fill="${BLUE}" stroke="${INK}" stroke-width="5"/>
       <path d="M214 12 v22 M214 114 v22 M152 74 h22 M254 74 h22" stroke="${PAPER}" stroke-width="6" stroke-linecap="round"/>
       <path d="M56 58 h52 M52 82 h44" stroke="${PAPER}" stroke-width="6" stroke-linecap="round"/>`,
      `<circle cx="92" cy="76" r="54" fill="${ORANGE}" stroke="${INK}" stroke-width="5"/>
       <path d="M168 -10 h62 v170 h-62 z" fill="${PINK}" stroke="${INK}" stroke-width="5"/>
       <path d="M180 30 h38 M180 60 h38 M180 90 h38 M180 120 h38" stroke="${INK}" stroke-width="4" opacity=".55"/>
       <path d="M132 38 l16 -16 16 16" fill="none" stroke="${PAPER}" stroke-width="6" stroke-linecap="round"/>`,
      `<path d="M30 132 L100 20 L170 132 Z" fill="${BLUE}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <path d="M222 16 l-30 62 h26 l-14 56 46 -72 h-28 l20 -46 z" fill="${GOLD}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <g fill="${PAPER}"><circle cx="20" cy="24" r="5"/><circle cx="44" cy="18" r="4"/><circle cx="278" cy="128" r="6"/><circle cx="256" cy="140" r="4"/></g>`,
      `<path d="M-10 28 L210 -10 L310 110 L90 150 Z" fill="${PINK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
       <circle cx="230" cy="108" r="39" fill="${MINT}" stroke="${INK}" stroke-width="5"/>
       <path d="M24 96 l18 -18 18 18 M24 118 l18 -18 18 18" fill="none" stroke="${PAPER}" stroke-width="6" stroke-linecap="round"/>`
    ];
    function coverFor(p, i) {
      const seed = [...(p.slug || '')].reduce((a, ch) => a + ch.charCodeAt(0), 0);
      const mirror = seed % 2 ? 'translate(300 0) scale(-1 1)' : '';
      const tilt = (seed % 5) - 2;
      const sx = 34 + (seed * 7) % 232;
      const sy = 20 + (seed * 11) % 100;
      const dot = [GOLD, PAPER, MINT][seed % 3];
      const idx = i % COVER_BASE.length;
      return `<rect width="300" height="150" fill="${COVER_BG[idx]}"/>
        <g transform="${mirror} rotate(${tilt} 150 75)">${COVER_BASE[idx]}</g>
        <path d="M${sx} ${sy} l5 11 11 5 -11 5 -5 11 -5-11 -11-5 11-5z"
              fill="${dot}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    }

    const params = new URLSearchParams(location.search);
    let activeCat = params.get('cat') && CATS.some(c => c.id === params.get('cat')) ? params.get('cat') : 'all';

    function buildFilters() {
      const chips = CATS.some(c => c.id === 'all') ? CATS : [{ id:'all', label:'全部' }].concat(CATS);
      $('arc-filters').innerHTML = chips.map(c => {
        const n = c.id === 'all' ? POSTS.length : POSTS.filter(p => p.category === c.id).length;
        return `<button class="arc-chip${c.id === activeCat ? ' active' : ''}" data-cat="${esc(c.id)}">${esc(c.label)}<span class="n">${String(n).padStart(2,'0')}</span></button>`;
      }).join('');
      $('arc-filters').querySelectorAll('.arc-chip').forEach(b =>
        b.addEventListener('click', () => { activeCat = b.dataset.cat; buildFilters(); render(); }));
    }

    function render() {
      const q = $('arc-q').value.trim().toLowerCase();
      const tilts = [-1.4, 1.3, -0.9, 1.6, -1.1, 0.8];
      const list = POSTS.filter(p => {
        if (activeCat !== 'all' && p.category !== activeCat) return false;
        if (!q) return true;
        return [p.title, p.subtitle, p.excerpt, ...(p.tags || [])].join(' ').toLowerCase().includes(q);
      }).sort((a, b) => b.date.localeCompare(a.date));

      $('arc-grid').innerHTML = list.map((p, i) => {
        const c = catOf(p);
        return `<a class="arc-card" href="index.html#post/${encodeURIComponent(p.slug)}"
            style="--c:${c.color};--tilt:${tilts[i % tilts.length]}deg">
          <div class="arc-art">
            <svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${coverFor(p, i)}</svg>
            <span class="arc-num">${String(i + 1).padStart(2, '0')}</span>
            <span class="arc-tag">${esc(c.en)}</span>
          </div>
          <div class="arc-body">
            <div class="arc-meta"><span class="cat">${esc(c.label)}</span> · ${esc(p.date)} · ${p.readTime} MIN</div>
            <h3>${esc(p.title)}</h3>
            <p>${esc(p.excerpt)}</p>
          </div>
        </a>`;
      }).join('');
      $('arc-empty').hidden = list.length > 0;
    }

    $('arc-q').addEventListener('input', render);
    buildFilters();
    render();
  })();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <title>ARTNH · 手绘贴纸标</title>
    <!-- 与站点亮色手绘体系一致：奶油/亮黄贴纸 + 粗黑描边 + 硬偏移阴影 +
         电光蓝 A + 珊瑚粉星。全部用路径绘制，不依赖网页字体，16px 仍可辨识。 -->
    <g transform="rotate(-4 32 32)" stroke-linejoin="round" stroke-linecap="round">

        <!-- 硬偏移阴影（贴纸感） -->
        <path d="M20 8 C13 8 8 12 7 19 C6 26 6 39 8 47 C9 54 14 57 21 57
                 C31 58 44 57 50 57 C56 56 58 51 58 44 C59 35 58 21 57 15
                 C56 9 51 7 44 6 C36 5 27 8 20 8 Z"
              transform="translate(3 4)" fill="#1B1830" />

        <!-- 亮黄手绘底板：四角各异的不规则轮廓 -->
        <path d="M20 8 C13 8 8 12 7 19 C6 26 6 39 8 47 C9 54 14 57 21 57
                 C31 58 44 57 50 57 C56 56 58 51 58 44 C59 35 58 21 57 15
                 C56 9 51 7 44 6 C36 5 27 8 20 8 Z"
              fill="#FFD84D" stroke="#1B1830" stroke-width="3" />

        <!-- 手绘 A：黑描边 + 蓝色笔芯，双层笔触 -->
        <g fill="none">
            <path d="M18 47 C21 35 26 22 32 17 C38 23 43 36 46 47" stroke="#1B1830" stroke-width="10" />
            <path d="M18 47 C21 35 26 22 32 17 C38 23 43 36 46 47" stroke="#3B4EFF" stroke-width="6" />
            <path d="M23 38 C29 39 36 37 41 38" stroke="#1B1830" stroke-width="8" />
            <path d="M23 38 C29 39 36 37 41 38" stroke="#3B4EFF" stroke-width="4.5" />
        </g>

        <!-- 珊瑚粉手绘星 -->
        <path d="M49 11 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z"
              fill="#FF5D8F" stroke="#1B1830" stroke-width="2" />

        <!-- 薄荷小点，补齐撞色 -->
        <circle cx="13" cy="49" r="2.6" fill="#2FD6A6" stroke="#1B1830" stroke-width="1.4" />
    </g>
</svg>
